name: Purge CF cache after deploy

# Cloudflare Pages reports a "Cloudflare Pages" GitHub Check Run when it finishes
# deploying a commit. We trigger on that check completing successfully for main,
# then purge the whole edge cache so the new build is live immediately, instead
# of waiting for the short s-maxage to expire. Purges are free + unlimited on CF.
#
# Why purge_everything (not selective): on this site one model/device change
# recomputes rankings across thousands of pages, so "changed pages" is rarely a
# small set. Everything-purge is simpler, correct, and the edge re-warms in
# seconds. workflow_dispatch is kept for manual purges / testing.
#
# ── THE RACE THIS EXISTS TO PREVENT (twice bitten) ─────────────────────────
# The check run goes green when Cloudflare finishes BUILDING, which is NOT the
# moment the new deployment is promoted to the live domain. Purging inside that
# window is worse than not purging at all: the edge immediately re-caches the
# OLD build, and `stale-while-revalidate=86400` then serves it for a day. Both
# times it happened the purge itself reported success, so the workflow looked
# healthy while production was stale.
#
# ── WHY WE POLL pages.dev AND NOT THE REAL DOMAIN ──────────────────────────
# The obvious readiness check is "poll the site until it serves the new build".
# Polling localmodel.run does NOT work from Actions, and fails silently, which
# is how #45 shipped a check that could never match. Confirmed by probing from
# a runner: every request to localmodel.run returns
#     HTTP 403  <title>Just a moment...</title>
# which is Cloudflare's Bot Fight Mode interstitial. It fires for bare curl, for
# a browser User-Agent, and over forced IPv4 alike, so it is the zone's bot
# protection and not the request shape. Bot Fight Mode stays ON deliberately
# (it turns away roughly 600 bots a day); the same block is why IndexNow
# submits from a local dist/ rather than from CI.
#
# localmodel-run.pages.dev serves the SAME deployment but lives on Cloudflare's
# own pages.dev domain, outside this zone, so the zone's Bot Fight Mode does not
# apply to it. That gives CI a readable promotion signal without weakening any
# security setting. /version.json is served `no-store`, so it always reflects
# the origin rather than an edge cache.
#
# If that ever stops being readable, the job does NOT get stuck or silently
# no-op: it falls back to the blind purge-wait-purge that this workflow used
# before, and says so in the log.

on:
  check_run:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: purge-cf
  cancel-in-progress: false

env:
  # Same deployment as localmodel.run, but outside the zone's Bot Fight Mode.
  READINESS_HOST: https://localmodel-run.pages.dev

jobs:
  purge:
    # Only on a successful PRODUCTION (main) Cloudflare Pages deploy, or a manual run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # Checked out only to read the expected version out of package.json.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.check_run.head_sha || github.sha }}

      - name: Wait for the deployment to be promoted
        id: wait
        run: |
          expected=$(jq -r .version package.json)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "Waiting for $READINESS_HOST to serve version $expected"
          for a in $(seq 1 20); do
            code=$(curl -s -o /tmp/v.json -w '%{http_code}' --max-time 20 \
                     "$READINESS_HOST/version.json" || echo "000")
            got=$(jq -r '.version // "?"' /tmp/v.json 2>/dev/null || echo "?")
            if [ "$code" = "200" ] && [ "$got" = "$expected" ]; then
              echo "promoted=true" >> "$GITHUB_OUTPUT"
              echo "✓ promoted: $READINESS_HOST serves $expected (after $a check(s))"
              exit 0
            fi
            echo "  attempt $a: HTTP $code, version '$got', want '$expected'"
            sleep 15
          done
          # Never fatal. A manual dispatch has no new deploy to wait for, and if
          # the readiness host stops being readable we still want the purge to
          # happen; the next step just falls back to the blind double purge.
          echo "promoted=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Could not confirm promotion via $READINESS_HOST; falling back to a blind double purge."

      - name: Purge the edge
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PROMOTED: ${{ steps.wait.outputs.promoted }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache"
          purge() {
            for a in 1 2 3; do
              r=$(curl -s -X POST "$api" \
                    -H "Authorization: Bearer $CF_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}')
              if echo "$r" | jq -e '.success' >/dev/null; then
                echo "  ✓ purge ok"
                return 0
              fi
              echo "  purge attempt $a failed: $(echo "$r" | jq -c '.errors')"
              sleep 5
            done
            return 1
          }

          if [ "$PROMOTED" = "true" ]; then
            # Promotion is confirmed, so a single purge lands after the swap and
            # there is nothing left to race against.
            echo "Promotion confirmed. Purging once:"
            purge || { echo "Purge failed." >&2; exit 1; }
          else
            # Unconfirmed: purge, wait past the promotion window, purge again.
            # The second purge is the load-bearing one, evicting anything the
            # edge re-cached from the old build during the swap.
            echo "Promotion unconfirmed. Purge 1 of 2 (immediate):"
            purge || { echo "First purge failed." >&2; exit 1; }
            echo "Waiting 150s for the deployment to be promoted..."
            sleep 150
            echo "Purge 2 of 2 (post-promotion, the load-bearing one):"
            purge || { echo "Second purge failed." >&2; exit 1; }
          fi
          echo "✓ Edge cleared."

      # Records what each host returns so a future change in either one is
      # visible in the log rather than being rediscovered the hard way.
      # localmodel.run is expected to 403 here; that is Bot Fight Mode working.
      - name: Host readability (diagnostic, never fatal)
        continue-on-error: true
        run: |
          probe() {
            code=$(curl -s -o /tmp/p.json -w '%{http_code}' --max-time 20 "$1/version.json" || echo "000")
            printf '  %-34s HTTP %s  %s\n' "$1" "$code" "$(head -c 90 /tmp/p.json | tr -d '\n')"
          }
          probe "$READINESS_HOST"
          probe "https://localmodel.run"
