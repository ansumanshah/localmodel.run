name: Purge CF cache after deploy

# Cloudflare Pages reports a "Cloudflare Pages" GitHub Check Run when it finishes
# deploying a commit. We trigger on that check completing successfully for main,
# then purge the whole edge cache so the new build is live immediately, instead
# of waiting for the short s-maxage to expire. Purges are free + unlimited on CF.
#
# Why purge_everything (not selective): on this site one model/device change
# recomputes rankings across thousands of pages, so "changed pages" is rarely a
# small set. Everything-purge is simpler, correct, and the edge re-warms in
# seconds. workflow_dispatch is kept for manual purges / testing.
#
# WHY THE DOUBLE PURGE BELOW EXISTS (load-bearing, twice bitten):
# the check run goes green when Cloudflare finishes BUILDING, which is not the
# same moment the new deployment is promoted to the live domain. Purging in that
# window is worse than not purging at all: the edge immediately re-caches the
# OLD build, and `stale-while-revalidate=86400` then serves it for a day. Both
# times it happened the purge itself reported success, so the workflow looked
# healthy while production was stale.
# The site cannot be polled for readiness from here: Cloudflare blocks the
# runner's datacenter IP, so a readiness check silently never matches. Purging
# twice with a wait in between needs no network access to the site at all.

on:
  check_run:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: purge-cf
  cancel-in-progress: false

jobs:
  purge:
    # Only on a successful PRODUCTION (main) Cloudflare Pages deploy, or a manual run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # WHY A BLIND DOUBLE PURGE AND NOT A READINESS CHECK:
      # the obvious fix is "poll the site until it serves the new version, then
      # purge". That was tried and it does not work from CI. Cloudflare blocks
      # the runner's datacenter IP, so every request from here comes back empty
      # and the wait can never observe the promotion. (Same reason IndexNow
      # submits from a local dist/ rather than from Actions.) The run still went
      # green because it fell through to its own warning path, which is exactly
      # the kind of "successful" workflow that hid this bug twice already.
      #
      # So: purge once now, wait past the promotion window, purge again. The
      # second purge is the one that matters. It evicts anything the edge
      # re-cached from the old build during the swap. Purges are free and
      # unlimited on Cloudflare, so a redundant one costs nothing, and unlike a
      # readiness check this cannot silently no-op.
      - name: Purge, wait past the promotion window, purge again
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache"
          purge() {
            for a in 1 2 3; do
              r=$(curl -s -X POST "$api" \
                    -H "Authorization: Bearer $CF_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}')
              if echo "$r" | jq -e '.success' >/dev/null; then
                echo "  ✓ purge ok"
                return 0
              fi
              echo "  purge attempt $a failed: $(echo "$r" | jq -c '.errors')"
              sleep 5
            done
            return 1
          }

          echo "Purge 1 of 2 (immediate):"
          purge || { echo "First purge failed." >&2; exit 1; }

          # Long enough to clear the gap between the Pages check going green and
          # the new deployment actually serving. Observed at roughly a minute;
          # 150s leaves real headroom without holding the runner long.
          echo "Waiting 150s for the deployment to be promoted..."
          sleep 150

          echo "Purge 2 of 2 (post-promotion, the load-bearing one):"
          purge || { echo "Second purge failed." >&2; exit 1; }
          echo "✓ Edge cleared after promotion."

      # Best-effort only, and it must never fail the job: this request is very
      # likely blocked from a GitHub runner. It exists so the log records the
      # HTTP status, which is how we find out if that ever changes.
      - name: Report what the edge serves (diagnostic, never fatal)
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/v.json -w '%{http_code}' --max-time 20 https://localmodel.run/version.json || echo "000")
          echo "GET /version.json -> HTTP $code"
          if [ "$code" = "200" ]; then
            echo "  served: $(jq -c '{version,commit}' /tmp/v.json 2>/dev/null)"
          else
            echo "  (no body; datacenter IPs are expected to be blocked here)"
          fi
