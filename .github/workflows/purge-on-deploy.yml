name: Purge CF cache after deploy

# Cloudflare Pages reports a "Cloudflare Pages" GitHub Check Run when it finishes
# deploying a commit. We trigger on that check completing successfully for main,
# then purge the whole edge cache so the new build is live immediately, instead
# of waiting for the short s-maxage to expire. Purges are free + unlimited on CF.
#
# Why purge_everything (not selective): on this site one model/device change
# recomputes rankings across thousands of pages, so "changed pages" is rarely a
# small set. Everything-purge is simpler, correct, and the edge re-warms in
# seconds. workflow_dispatch is kept for manual purges / testing.
#
# WHY THE WAIT BELOW EXISTS (this bit is load-bearing, twice bitten):
# the check run goes green when Cloudflare finishes BUILDING, which is not the
# same moment the new deployment is promoted to the live domain. Purging in that
# window is worse than not purging at all: the edge immediately re-caches the
# OLD build, and `stale-while-revalidate=86400` then serves it for a day. Both
# times it happened the purge itself reported success, so the workflow looked
# healthy while production was stale.
# /version.json is served `no-store`, so it always reflects the ORIGIN, never the
# edge. That makes it an exact promotion signal: once it reports this commit's
# package.json version, the deployment is live and a purge is safe.

on:
  check_run:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: purge-cf
  cancel-in-progress: false

jobs:
  purge:
    # Only on a successful PRODUCTION (main) Cloudflare Pages deploy, or a manual run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # Checked out only to read the expected version out of package.json.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.check_run.head_sha || github.sha }}

      - name: Wait for the deployment to be promoted
        id: wait
        run: |
          expected=$(jq -r .version package.json)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "Waiting for localmodel.run to serve version $expected"
          for a in $(seq 1 20); do
            got=$(curl -sf --max-time 20 https://localmodel.run/version.json | jq -r .version 2>/dev/null || echo "?")
            if [ "$got" = "$expected" ]; then
              echo "✓ origin is serving $expected (after ${a} check(s))"
              exit 0
            fi
            echo "  attempt $a: origin serving '$got', want '$expected'"
            sleep 15
          done
          # Not fatal: a manual dispatch has no new deploy to wait for, and a
          # purge against an already-current origin is harmless. Purge anyway,
          # but say plainly that the promotion was never observed.
          echo "::warning::Never observed version $expected within ~5 min; purging anyway."

      - name: Purge everything (retry up to 3x)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache"
          for a in 1 2 3; do
            r=$(curl -s -X POST "$api" \
                  -H "Authorization: Bearer $CF_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data '{"purge_everything":true}')
            if echo "$r" | jq -e '.success' >/dev/null; then
              echo "✓ Cache purged."
              exit 0
            fi
            echo "purge attempt $a failed: $(echo "$r" | jq -c '.errors')"
            sleep 5
          done
          echo "Purge failed after 3 attempts." >&2
          exit 1

      # A purge that "succeeded" while the edge kept the old build is the exact
      # failure this workflow exists to prevent, so prove the edge is current
      # rather than trusting the purge's own success flag.
      - name: Confirm the edge is serving the new build
        run: |
          expected='${{ steps.wait.outputs.expected }}'
          for a in 1 2 3 4 5; do
            sleep 10
            got=$(curl -sf --max-time 20 https://localmodel.run/version.json | jq -r .version 2>/dev/null || echo "?")
            status=$(curl -sI --max-time 20 https://localmodel.run/ | grep -i '^cf-cache-status:' | tr -d '\r' || true)
            echo "  attempt $a: version '$got' | $status"
            if [ "$got" = "$expected" ]; then
              echo "✓ Edge re-warmed on $expected."
              exit 0
            fi
          done
          echo "::warning::Edge did not confirm $expected after the purge; check the deployment."
