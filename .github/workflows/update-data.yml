name: Refresh model data

# Pulls fresh GGUF sizes from Ollama + HuggingFace on a schedule and commits
# any changes only after test/build/link gates. GITHUB_TOKEN pushes deploy via
# Cloudflare but cannot trigger CI, so this workflow also submits IndexNow.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Refresh data from primary sources
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bun run update-data
      - name: Validate dataset
        run: bun run validate-data
      - name: Refresh the validated Arena comparison snapshot
        id: arena
        continue-on-error: true
        run: bun run update:arena
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Verify refreshed data before deployment
        run: |
          bun test
          bun run check
          bun run build
          bun run audit:links
      # A dispatch on a PR branch verifies the refresh without publishing data.
      - name: Commit changes if any
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain src/data)" ]]; then
            git config user.name "data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data
            git commit -m "chore: refresh model data ($(date -u +%Y-%m-%d))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes."
          fi
      - name: Submit refreshed URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        run: node scripts/indexnow.mjs
      - name: Report an Arena refresh failure
        if: steps.arena.outcome == 'failure'
        run: |
          echo "::error::Arena refresh failed. The previous snapshot was retained; valid catalog updates were handled separately."
          exit 1
