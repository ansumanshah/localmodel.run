name: Refresh model data

# Pulls fresh GGUF sizes from Ollama + HuggingFace on a schedule and commits
# any changes. The push triggers the deploy workflow, so the site rebuilds with
# current numbers without manual work.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # No `bun install`: update-data, validate-data and update:arena import only
      # Node/Bun builtins and files in this repo (verified from a clean archive
      # with no node_modules), so the dependency install and its cache are dead
      # weight. If one of them ever gains an npm import, it fails loudly here.
      - name: Refresh data from primary sources
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bun run update-data
      - name: Validate dataset
        run: bun run validate-data
      - name: Refresh the validated Arena comparison snapshot
        id: arena
        continue-on-error: true
        run: bun run update:arena
      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain src/data)" ]]; then
            git config user.name "data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data
            git commit -m "chore: refresh model data ($(date -u +%Y-%m-%d))"
            git push || echo "push failed — check branch protection on main"
          else
            echo "No data changes."
          fi
      - name: Report an Arena refresh failure
        if: steps.arena.outcome == 'failure'
        run: |
          echo "::error::Arena refresh failed. The previous snapshot was retained; valid catalog updates were handled separately."
          exit 1
