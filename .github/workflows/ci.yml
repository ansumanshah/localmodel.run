name: CI

# The PR gate. Cloudflare deploys straight off main, so this is what catches a
# broken build, bad data or a mobile layout regression before it ships.
#
# Billed minutes are what matter here (jobs are rounded up to the whole minute),
# so everything stays in ONE job: a second job would repeat checkout, bun setup,
# install and cache restore. The savings come from not repeating work instead:
#   - PR: full gate, but docs/non-site PRs skip entirely (paths-ignore), and PRs
#     that touch nothing the site is built from run only the cheap checks.
#   - push to main: every change on main arrives through a squash-merged PR that
#     already passed the full gate, so main only re-runs the cheap gates, the
#     build and the link audit, then submits IndexNow (which needs dist/).
#     Typecheck and the mobile audit are not repeated.
#   - Data-refresh cron commits are pushed with GITHUB_TOKEN, which GitHub never
#     lets trigger workflows, so they never reach this file at all.
#     (update-data.yml runs validate-data itself before it pushes.)
# Nothing requires this check to pass for merging (no branch protection), so a
# skipped run cannot block a PR.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - ".codex/**"
      - "docs/**"
      - "hf-space/**"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - ".codex/**"
      - "docs/**"
      - "hf-space/**"
      - "LICENSE*"
  workflow_dispatch: {}

# A newer push to the same ref cancels the in-flight run — no stale builds queueing up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # PRs check out the merge commit; depth 2 reaches its first parent (the
      # base) so the scope step below can diff exactly what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # Decide how much of the pipeline this run needs.
      #   site   = something the built site depends on changed (or not a PR)
      #   gates  = run the PR-only gates: typecheck + mobile render audit
      #            (full on PRs that touch the site and on manual dispatch;
      #            off for pushes to main, which already passed them as a PR)
      # Both default to true so any unexpected event runs everything.
      - name: Scope this run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          # Anything that changes what `bun run build` emits, or the audits' own code.
          SITE_RE: '^(src/|public/|astro\.config\.|package\.json$|bun\.lock$|tsconfig|scripts/(copy-ort-wasm|mobile-audit|audit-links)|\.github/workflows/ci\.yml$)'
        run: |
          site=true
          gates=true
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed files:"; echo "$changed"
            if ! echo "$changed" | grep -Eq "$SITE_RE"; then
              site=false
              gates=false
              echo "No site-affecting files changed: skipping typecheck, build and audits."
            fi
          elif [ "$EVENT" = "push" ]; then
            gates=false
            echo "Push to main: the PR already passed typecheck and the mobile audit."
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"

      # Pinned, not `latest`: a floating toolchain lets a bun release change this
      # build with zero commits, on a repo that auto-deploys off main.
      # Pinned to 1.4.0 to MATCH the local bun. That divergence is what made
      # bun.lock regeneration dangerous, because 1.4.0 strips all 25
      # @rollup/rollup-* optional platform entries when it rewrites a lockfile,
      # including the linux-x64-gnu this runner needs, while rollup@4.62.0 still
      # declares them. Verified on #50 that 1.4.0 INSTALLS the current lockfile
      # cleanly under --frozen-lockfile and builds all 6,972 pages on Linux, so
      # the stripping only bites on regeneration, not on install.
      # Keep this in step with the bun that generates bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Cache the resolved package store so installs are near-instant after the first run.
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Unit tests (compute/rig math)
        run: bun test

      - name: Validate dataset
        run: bun run validate-data

      # Typecheck and build are independent and CPU-bound, so they share the
      # runner concurrently instead of running back to back. Same job, same
      # install: billed time drops by roughly the shorter of the two.
      # `astro check` output is buffered and replayed so the log stays readable.
      - name: Typecheck and build
        if: steps.scope.outputs.site == 'true'
        env:
          GATES: ${{ steps.scope.outputs.gates }}
        run: |
          check_pid=""
          if [ "$GATES" = "true" ]; then
            bun run check > check.log 2>&1 &
            check_pid=$!
          fi
          build_rc=0
          bun run build || build_rc=$?
          check_rc=0
          if [ -n "$check_pid" ]; then
            wait "$check_pid" || check_rc=$?
            echo "::group::bun run check (rc=$check_rc)"
            cat check.log
            echo "::endgroup::"
          fi
          [ "$build_rc" -eq 0 ] && [ "$check_rc" -eq 0 ]

      # Parse the built dist/ and fail on any broken internal link
      # (orphan pages are reported but don't fail). The OSS Screaming-Frog stand-in.
      - name: Audit internal links
        if: steps.scope.outputs.site == 'true'
        run: bun scripts/audit-links.ts

      # Headless phone-viewport render check on the built dist/. Runs at 360px,
      # the mainstream Android floor (stricter than iPhone's 390px), and fails on
      # horizontal overflow, a leaked desktop nav, console/page errors, non-200,
      # or a blank page. Catches both the header `display` regression and the
      # grid/flex `min-w-0` overflow class (a table pinning a grid item wider
      # than its column on narrow screens).
      # Read the pinned playwright range out of package.json so the cache key
      # below depends on THAT and nothing else.
      - name: Resolve Playwright version
        id: pw
        if: steps.scope.outputs.gates == 'true' || github.event_name == 'push'
        run: echo "v=$(node -p "require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"

      # A PR can only restore caches saved by main (or by itself), so main has to
      # keep the browser cache populated even though its own run never uses it.
      # On push this is lookup-only: no 261 MB download, it only checks the entry
      # exists, and the install below runs (and the entry is saved) just on a miss.
      - name: Cache Playwright browser
        id: pwcache
        if: steps.scope.outputs.gates == 'true' || github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the playwright version ALONE. This used to hash the whole
          # package.json, which sounds equivalent but is not: the pre-commit
          # hook bumps the version field on every single commit, so the key
          # never repeated, the primary cache never hit, and every run uploaded
          # another ~261 MB browser cache. That had piled up 12 duplicate
          # entries and 3.7 GB of the repo's 10 GB cache budget, which
          # eventually evicts the bun cache too.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          restore-keys: playwright-${{ runner.os }}-
          lookup-only: ${{ github.event_name == 'push' }}

      # No --with-deps: ubuntu-latest already ships the OS libs Chromium needs,
      # and --with-deps re-runs apt-get every build regardless of the binary cache.
      # Skipped on an exact cache hit (the browser is already on disk).
      - name: Install Playwright Chromium
        if: (steps.scope.outputs.gates == 'true' || github.event_name == 'push') && steps.pwcache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      # Sample caps: every route SHAPE is still tested (the 41 shapes with <= 40
      # pages in full; the 8 big parametric families sampled, biased to the
      # longest slugs, which is where overflow lives). 20/10 keeps all of that at
      # about 40% of the old 60/40 page count.
      - name: Mobile render audit
        if: steps.scope.outputs.gates == 'true'
        env:
          CONCURRENCY: 4
          VIEWPORT: 360x800
          PAIR_CAP: 20
          BIG_CAP: 10
        run: |
          bun run preview &
          for _ in $(seq 1 30); do curl -sf http://localhost:4321/ >/dev/null && break; sleep 1; done
          bun run audit:mobile

      - name: Upload mobile-audit failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-failures
          path: playwright-failures/
          if-no-files-found: ignore

      # Submit the freshly-built sitemap URLs to IndexNow (Bing/Yandex/Naver + the
      # AI engines on the Bing index). Reads dist/ from disk: a datacenter IP
      # fetching the public sitemap is blocked by CF Bot Fight Mode. Main pushes
      # only, so PRs don't ping it. node has global fetch.
      - name: Submit URLs to IndexNow
        if: "github.ref == 'refs/heads/main' && github.event_name == 'push'"
        run: node scripts/indexnow.mjs
